# Full observability stack. Bring up with:  docker compose up -d --wait
# Defaults work as-is; see .env.example for the few knobs. Ports bind to 127.0.0.1 only.
name: monitoring-observability

volumes:
  prometheus-data:
  prometheus-global-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data:

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # The whole ./prometheus tree is mounted so rule_files globs and file_sd targets resolve.
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/l1-basic-scrape-config/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # l6: a second Prometheus that federates recording-rule series from the first one.
  prometheus-global:
    image: prom/prometheus:v3.15.1
    container_name: prometheus-global
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/l6-recording-rules-federation/federation-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-global-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    expose:
      - "9100"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./prometheus/l5-alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/l2-provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/l2-provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/l3-loki-config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Grafana Alloy replaces Promtail (EOL 2026-03-02).
  alloy:
    image: grafana/alloy:v1.21.2
    container_name: alloy
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./loki/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:3.1.1
    container_name: tempo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:9411:9411"
      - "127.0.0.1:14268:14268"
    volumes:
      - ./tempo/l4-tempo-config/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo-config.yml

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:55679:55679"
    volumes:
      - ./opentelemetry/l4-otel-collector/otel-collector-config.yml:/etc/otel/otel-collector-config.yml:ro
    command:
      - --config=/etc/otel/otel-collector-config.yml
    depends_on:
      - prometheus
      - loki
      - tempo

  custom-exporter:
    build:
      context: ./custom-exporter/l-max-go-exporter
    container_name: custom-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      LISTEN_ADDR: ":9200"
      METRICS_NAMESPACE: app

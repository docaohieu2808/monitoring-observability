# Tempo 3.x single binary (-target=all). Tempo 3 removed the ingester/compactor modules (live-store,
# block-builder and backend-scheduler replace them) and the OpenCensus receiver. See
# https://github.com/grafana/tempo/tree/main/example/docker-compose/single-binary
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
    zipkin:
      endpoint: 0.0.0.0:9411

# Block retention moved from compactor.compaction to the backend scheduler in Tempo 3.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: demo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: both

usage_report:
  reporting_enabled: false

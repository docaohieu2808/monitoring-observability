groups:
  - name: node.recording
    interval: 1m
    rules:
      - record: instance:node_cpu_utilisation:rate5m
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

      - record: instance:node_memory_utilisation:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

      - record: instance:node_disk_utilisation:ratio
        expr: 1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})

      - record: instance:node_network_receive_bytes:rate5m
        expr: sum by(instance) (rate(node_network_receive_bytes_total{device!~"lo|veth.*"}[5m]))

      - record: instance:node_network_transmit_bytes:rate5m
        expr: sum by(instance) (rate(node_network_transmit_bytes_total{device!~"lo|veth.*"}[5m]))

  - name: postgresql.recording
    interval: 1m
    rules:
      - record: instance:pg_connections_utilisation:ratio
        expr: sum by(instance) (pg_stat_activity_count) / on(instance) max by(instance) (pg_settings_max_connections)

      - record: instance:pg_cache_hit_rate:ratio
        expr: avg by(instance) (pg_stat_database_blks_hit / (pg_stat_database_blks_hit + pg_stat_database_blks_read + 1))

      - record: instance:pg_transaction_rate:rate5m
        expr: sum by(instance) (rate(pg_stat_database_xact_commit[5m]) + rate(pg_stat_database_xact_rollback[5m]))

  - name: redis.recording
    interval: 1m
    rules:
      - record: instance:redis_memory_utilisation:ratio
        expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0)

      - record: instance:redis_commands_rate:rate5m
        expr: rate(redis_commands_processed_total[5m])

      - record: instance:redis_hit_rate:ratio
        expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total + 1)

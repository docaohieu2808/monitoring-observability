# Second ("global") Prometheus that federates pre-aggregated series from the primary.
# Run by the compose service prometheus-global. Federation scrapes the primary's /federate.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: demo-federated
    env: lab

scrape_configs:
  - job_name: federate-primary
    scrape_interval: 1m
    honor_labels: true
    metrics_path: /federate
    params:
      match[]:
        - '{__name__=~"instance:.*"}'
        - '{__name__=~"job:.*"}'
        - 'up'
        - 'scrape_duration_seconds'
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          federated_from: primary

  # Local scrape for this instance's own health.
  - job_name: prometheus-global
    static_configs:
      - targets: [localhost:9090]

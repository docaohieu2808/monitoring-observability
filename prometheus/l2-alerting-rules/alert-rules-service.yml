groups:
  - name: service.alerts
    interval: 1m
    rules:
      # One generic alert for every scrape job (node, postgres, redis, ... exporters included),
      # instead of one near-identical "up == 0" rule per exporter.
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} (job {{ $labels.job }}) is down"
          description: "Scrape target {{ $labels.instance }} (job: {{ $labels.job }}) has been unreachable for more than 1 minute"

      - alert: PrometheusScrapeDurationSlow
        expr: scrape_duration_seconds > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow scrapes of {{ $labels.instance }} (job {{ $labels.job }})"
          description: "Scraping {{ $labels.instance }} takes {{ $value | printf \"%.1f\" }}s (threshold: 10s)"

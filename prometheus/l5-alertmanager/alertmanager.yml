global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.example.com:587
  smtp_from: alertmanager@example.com
  smtp_auth_username: alertmanager@example.com
  smtp_auth_password: changeme
  slack_api_url: https://hooks.slack.com/services/CHANGE/ME/changeme

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  group_by: [alertname, cluster, env]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default-receiver
  routes:
    - matchers:
        - severity = critical
      receiver: critical-receiver
      continue: true
    - matchers:
        - severity = warning
      receiver: slack-warnings
      group_interval: 10m
      repeat_interval: 12h
    - matchers:
        - alertname =~ "Postgres.*|Redis.*"
      receiver: dba-receiver
      group_by: [alertname, instance]

receivers:
  - name: default-receiver
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: critical-receiver
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: ':fire: CRITICAL: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Instance:* {{ .Labels.instance }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
    email_configs:
      - to: oncall@example.com
        send_resolved: true
        headers:
          Subject: '[CRITICAL] {{ .CommonLabels.alertname }} on {{ .CommonLabels.instance }}'
    pagerduty_configs:
      - routing_key: changeme-pagerduty-integration-key
        severity: critical
        description: '{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}'

  - name: slack-warnings
    slack_configs:
      - channel: '#alerts-warning'
        send_resolved: true
        title: ':warning: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

  - name: dba-receiver
    slack_configs:
      - channel: '#alerts-database'
        send_resolved: true
        title: ':database: DB Alert: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
    email_configs:
      - to: dba@example.com
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, instance]

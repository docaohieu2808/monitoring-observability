global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: server-2
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - 203.0.113.15:9100
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: (.+):\d+
        replacement: $1

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - 203.0.113.15:9187
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: (.+):\d+
        replacement: $1

  - job_name: redis-exporter
    static_configs:
      - targets:
          - 203.0.113.15:9121
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: (.+):\d+
        replacement: $1
